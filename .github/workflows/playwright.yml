name: Playwright E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Lint (custom QA ruleset)
        run: npm run lint

  test:
    name: E2E (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: verify
    strategy:
      # Never cancel the other browsers because one failed - the point is the full
      # cross-browser picture in a single run.
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # chromium is always installed, not just for the chromium job: global-setup launches a
      # chromium browser to capture the session, so every job needs it.
      - name: Install Playwright browsers (chromium + ${{ matrix.project }})
        run: npx playwright install --with-deps chromium ${{ matrix.project }}

      # No credentials: global-setup registers its own throwaway account per run, keeping CI
      # isolated from any developer's account. Only the target URLs are supplied.
      - name: Register test account & run E2E suite
        run: npx playwright test --project=${{ matrix.project }}
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: results.json

      - name: Generate run summary
        if: ${{ !cancelled() }}
        run: node .github/scripts/summarise.mjs "${{ matrix.project }}"

      - name: Upload smart HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: report-${{ matrix.project }}
          path: |
            smart-report.html
            playwright-report/
          retention-days: 30

      - name: Upload failure evidence (traces, videos, screenshots)
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: failure-evidence-${{ matrix.project }}
          path: |
            test-results/
            failures/
          retention-days: 30

  summary:
    name: Results summary
    runs-on: ubuntu-latest
    needs: [verify, test]
    if: ${{ !cancelled() }}
    steps:
      - name: Report matrix outcome
        run: |
          {
            echo "## Playwright E2E — all browsers"
            echo ""
            echo "| Job | Outcome |"
            echo "|---|---|"
            echo "| Lint & typecheck | ${{ needs.verify.result }} |"
            echo "| E2E matrix (chromium, firefox, webkit) | ${{ needs.test.result }} |"
            echo ""
            echo "Per-browser counts are in each job's own summary."
            echo "HTML reports and failure evidence are attached as run artifacts."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if any browser failed
        if: ${{ needs.test.result != 'success' }}
        run: exit 1
